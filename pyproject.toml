[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bridge"
version = "0.2.0"
description = "Shared-file requests between agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.scripts]
bridge = "bridge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["bridge"]
